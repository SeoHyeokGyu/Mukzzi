basePath: /
definitions:
  dto.BadgeResponse:
    properties:
      acquired:
        type: boolean
      acquired_at:
        type: string
      code:
        type: string
      description:
        type: string
      icon_url:
        type: string
      id:
        example: "0"
        type: string
      name:
        type: string
    type: object
  dto.CollectionResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.BadgeResponse'
        type: array
      error:
        $ref: '#/definitions/dto.ErrorInfo'
      pagination:
        $ref: '#/definitions/dto.PaginationInfo'
      success:
        type: boolean
    type: object
  dto.ErrorInfo:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dto.ErrorInfo'
      success:
        type: boolean
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.PaginationInfo:
    properties:
      has_next:
        type: boolean
      limit:
        type: integer
      next_cursor:
        type: string
      page:
        type: integer
      total_count:
        type: integer
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      nickname:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  handler.ErrorResponse:
    properties:
      code:
        example: USER_NOT_FOUND
        type: string
      details: {}
      message:
        example: 해당 사용자를 찾을 수 없습니다.
        type: string
    type: object
  handler.Pagination:
    properties:
      has_next:
        example: true
        type: boolean
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      total_count:
        example: 100
        type: integer
    type: object
  handler.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/handler.ErrorResponse'
      pagination:
        $ref: '#/definitions/handler.Pagination'
      success:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Mukzzi 서비스 API 문서입니다.
  title: Mukzzi API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 아이디와 비밀번호로 로그인하고 JWT 토큰을 반환합니다.
      parameters:
      - description: 로그인 정보
        in: body
        name: LoginRequest
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 사용자 로그인
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: 새로운 사용자를 등록합니다.
      parameters:
      - description: 회원가입 정보
        in: body
        name: RegisterRequest
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 사용자 회원가입
      tags:
      - auth
  /api/collections/badges:
    get:
      consumes:
      - application/json
      description: 사용자의 획득/미획득 뱃지 목록을 커서 기반 페이지네이션으로 반환합니다.
      parameters:
      - description: '획득한 뱃지 포함 여부 (기본값: true)'
        in: query
        name: include_acquired
        type: boolean
      - description: '페이지당 항목 수 (기본값: 20, 최대: 50)'
        in: query
        name: limit
        type: integer
      - description: 다음 페이지 커서
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 뱃지 목록 조회 성공
          schema:
            $ref: '#/definitions/dto.CollectionResponse'
        "400":
          description: 잘못된 쿼리 파라미터
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: 인증 토큰 누락 또는 유효하지 않음
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 서버 내부 에러
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 뱃지 목록 조회
      tags:
      - collections
  /api/menus/search:
    get:
      consumes:
      - application/json
      description: 메뉴명으로 검색합니다. USER 소스 포함, 공식 소스 우선 정렬.
      parameters:
      - description: 검색어
        in: query
        name: query
        required: true
        type: string
      - description: 카테고리 (KOREAN, CHINESE, JAPANESE, WESTERN, SNACK, CAFE, OTHER)
        in: query
        name: category
        type: string
      - description: 다음 페이지 커서
        in: query
        name: cursor
        type: string
      - description: '페이지당 항목 수 (기본값: 20, 최대: 50)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: 메뉴 검색
      tags:
      - menus
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
