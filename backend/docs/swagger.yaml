basePath: /
definitions:
  dto.BadgeErrorResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/dto.ErrorInfo'
      pagination: {}
      success:
        example: false
        type: boolean
    type: object
  dto.BadgeResponse:
    properties:
      acquired:
        type: boolean
      acquired_at:
        type: string
      code:
        type: string
      description:
        type: string
      icon_url:
        type: string
      id:
        example: "0"
        type: string
      name:
        type: string
    type: object
  dto.BadgeSuccessResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.BadgeResponse'
        type: array
      error:
        $ref: '#/definitions/dto.ErrorInfo'
      pagination:
        $ref: '#/definitions/dto.PaginationInfo'
      success:
        example: true
        type: boolean
    type: object
  dto.ErrorInfo:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.PaginationInfo:
    properties:
      has_next:
        type: boolean
      limit:
        type: integer
      next_cursor:
        type: string
      page:
        type: integer
      total_count:
        type: integer
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      nickname:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  dto.UserUpdateRequest:
    properties:
      email:
        type: string
      nickname:
        type: string
      password:
        minLength: 6
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  handler.Pagination:
    properties:
      has_next:
        example: true
        type: boolean
      limit:
        example: 20
        type: integer
      next_cursor:
        type: string
      page:
        example: 1
        type: integer
      total_count:
        example: 100
        type: integer
    type: object
  handler.Response:
    properties:
      data:
        items:
          type: object
        type: array
      error:
        $ref: '#/definitions/handler.ErrorResponse'
      pagination:
        $ref: '#/definitions/handler.Pagination'
      success:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Mukzzi 서비스 API 문서입니다.
  title: Mukzzi API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 아이디와 비밀번호로 로그인하고 JWT 토큰을 반환합니다.
      parameters:
      - description: 로그인 정보
        in: body
        name: LoginRequest
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 사용자 로그인
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: 새로운 사용자를 등록합니다.
      parameters:
      - description: 회원가입 정보
        in: body
        name: RegisterRequest
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 사용자 회원가입
      tags:
      - auth
  /api/collections/badges:
    get:
      consumes:
      - application/json
      description: 사용자의 획득/미획득 뱃지 목록을 커서 기반 페이지네이션으로 반환합니다.
      parameters:
      - description: '획득한 뱃지 포함 여부 (기본값: true, 허용값: ''true''|''false'')'
        in: query
        name: include_acquired
        type: boolean
      - description: '페이지당 항목 수 (기본값: 20, 범위: 1-50)'
        in: query
        name: limit
        type: integer
      - description: 다음 페이지 커서 (이전 응답의 next_cursor 값 사용)
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 뱃지 목록 조회 성공
          schema:
            $ref: '#/definitions/dto.BadgeSuccessResponse'
        "400":
          description: 잘못된 쿼리 파라미터
          schema:
            $ref: '#/definitions/dto.BadgeErrorResponse'
        "401":
          description: 인증 토큰 누락 또는 유효하지 않음
          schema:
            $ref: '#/definitions/dto.BadgeErrorResponse'
        "500":
          description: 서버 내부 에러
          schema:
            $ref: '#/definitions/dto.BadgeErrorResponse'
      security:
      - BearerAuth: []
      summary: 뱃지 목록 조회
      tags:
      - collections
  /api/menus/search:
    get:
      consumes:
      - application/json
      description: 메뉴명으로 검색합니다. USER 소스 포함, 공식 소스 우선 정렬.
      parameters:
      - description: 검색어
        in: query
        name: query
        required: true
        type: string
      - description: 카테고리 (KOREAN, CHINESE, JAPANESE, WESTERN, SNACK, CAFE, OTHER)
        in: query
        name: category
        type: string
      - description: 다음 페이지 커서
        in: query
        name: cursor
        type: string
      - description: '페이지당 항목 수 (기본값: 20, 최대: 50)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: 메뉴 검색
      tags:
      - menus
  /api/users/{id}:
    delete:
      consumes:
      - application/json
      description: 계정을 삭제합니다. 삭제된 계정은 복구할 수 없습니다.
      parameters:
      - description: 사용자 ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 계정 삭제 성공
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 잘못된 사용자 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: 인증 토큰 누락 또는 유효하지 않음
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 서버 내부 에러
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: 계정 삭제
      tags:
      - users
    get:
      consumes:
      - application/json
      description: 특정 사용자의 프로필 정보를 조회합니다.
      parameters:
      - description: 사용자 ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 사용자 프로필 조회 성공
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 잘못된 사용자 ID
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 사용자를 찾을 수 없습니다
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 서버 내부 에러
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 사용자 프로필 조회
      tags:
      - users
    put:
      consumes:
      - application/json
      description: 자신의 프로필 정보를 수정합니다. 본인만 수정 가능합니다.
      parameters:
      - description: 사용자 ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: 프로필 수정 정보
        in: body
        name: UserUpdateRequest
        required: true
        schema:
          $ref: '#/definitions/dto.UserUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 프로필 수정 성공
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 잘못된 사용자 ID 또는 요청 형식
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: 인증 토큰 누락 또는 유효하지 않음
          schema:
            $ref: '#/definitions/handler.Response'
        "403":
          description: 자신의 프로필만 수정 가능
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 서버 내부 에러
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: 사용자 프로필 수정
      tags:
      - users
  /api/users/me:
    get:
      consumes:
      - application/json
      description: 로그인한 현재 사용자의 프로필 정보를 조회합니다.
      produces:
      - application/json
      responses:
        "200":
          description: 사용자 프로필 조회 성공
          schema:
            $ref: '#/definitions/handler.Response'
        "401":
          description: 인증 토큰 누락 또는 유효하지 않음
          schema:
            $ref: '#/definitions/handler.Response'
        "404":
          description: 사용자를 찾을 수 없습니다
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 서버 내부 에러
          schema:
            $ref: '#/definitions/handler.Response'
      security:
      - BearerAuth: []
      summary: 현재 사용자 프로필 조회
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
