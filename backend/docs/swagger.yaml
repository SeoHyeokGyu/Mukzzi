basePath: /
definitions:
  handler.ApiResponse:
    properties:
      data: {}
      error: {}
      pagination: {}
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Mukzzi 서비스 API 문서입니다.
  title: Mukzzi API
  version: "1.0"
paths:
  /api/v1/collections/badges:
    get:
      consumes:
      - application/json
      description: 사용자의 획득/미획득 뱃지 목록을 커서 기반 페이지네이션으로 반환합니다.
      parameters:
      - description: '획득한 뱃지 포함 여부 (기본값: true)'
        in: query
        name: include_acquired
        type: boolean
      - description: '페이지당 항목 수 (기본값: 20, 최대: 50)'
        in: query
        name: limit
        type: integer
      - description: 다음 페이지 커서
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ApiResponse'
      security:
      - BearerAuth: []
      summary: 뱃지 목록 조회
      tags:
      - collections
  /api/v1/menus/search:
    get:
      consumes:
      - application/json
      description: 메뉴명으로 검색합니다. USER 소스 포함, 공식 소스 우선 정렬.
      parameters:
      - description: 검색어
        in: query
        name: query
        required: true
        type: string
      - description: 카테고리 (KOREAN, CHINESE, JAPANESE, WESTERN, SNACK, CAFE, OTHER)
        in: query
        name: category
        type: string
      - description: 다음 페이지 커서
        in: query
        name: cursor
        type: string
      - description: '페이지당 항목 수 (기본값: 20, 최대: 50)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ApiResponse'
      security:
      - BearerAuth: []
      summary: 메뉴 검색
      tags:
      - menus
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
