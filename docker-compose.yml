services:
  frontend:
    image: ghcr.io/seohyeokgyu/mukzzi/frontend:latest
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ghcr.io/seohyeokgyu/mukzzi/backend:latest
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_IP=${SERVER_IP}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=production
      - MFDS_API_KEY=${MFDS_API_KEY}
      - USDA_API_KEY=${USDA_API_KEY}
      - ADMIN_USER_ID=${ADMIN_USER_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Oracle Cloud 유휴 자원 회수 방지 (CPU 10% 초과 유지)
  # 1코어 x 50% = 전체 4코어 기준 12.5% 사용
#  stress:
#    image: alexeiled/stress-ng:latest
#    command: --cpu 1 --cpu-load 50 --timeout 0
#    restart: unless-stopped
#    deploy:
#      resources:
#        limits:
#          cpus: "0.6"
#          memory: 64m

volumes:
  postgres_data:
  redis_data:
