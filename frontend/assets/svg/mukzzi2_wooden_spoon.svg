<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- 숟가락 나무 따뜻한 톤 그라데이션 -->
    <linearGradient id="spoonWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4c493"/>
      <stop offset="60%" stop-color="#d99452"/>
      <stop offset="100%" stop-color="#a8692c"/>
    </linearGradient>
    <!-- 숟가락 안쪽 음영 그라데이션 -->
    <linearGradient id="spoonInsideShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a511c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a511c" stop-opacity="0"/>
    </linearGradient>
    <!-- 입체감을 위한 그림자 필터 -->
    <filter id="spoonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="5" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 숟가락 그룹: 햄스터 손 위치(340, 635)를 중심으로 자연스럽게 대각선으로 기울임(-25도) -->
  <g transform="translate(340, 635) rotate(-25)" filter="url(#spoonShadow)">

    <!-- 1. 숟가락 손잡이 (Handle) -->
    <!-- 손에 쥐어지는 아래쪽 대 부분입니다 -->
    <path d="M -7,15 L -4,75 C -4,82 4,82 4,75 L 7,15 Z" fill="url(#spoonWoodGrad)" stroke="#8a511c" stroke-width="1.5"/>

    <!-- 2. 손잡이와 머리 연결 목 부분 (Neck) -->
    <path d="M -7,15 C -7,0 -11,-15 -14,-25 L 14,-25 C 11,-15 7,0 7,15 Z" fill="url(#spoonWoodGrad)" stroke="#8a511c" stroke-width="1.5"/>

    <!-- 3. 숟가락 머리 베이스 (Bowl) -->
    <!-- 음식을 담는 통통한 타원형 머리입니다 -->
    <ellipse cx="0" cy="-65" rx="32" ry="42" fill="url(#spoonWoodGrad)" stroke="#8a511c" stroke-width="2"/>

    <!-- 4. 숟가락 안쪽 오목한 음영 표현 -->
    <ellipse cx="0" cy="-62" rx="25" ry="34" fill="url(#spoonInsideShadow)"/>

    <!-- 5. 하이라이트 반사광 (귀여운 캐릭터 느낌을 주는 요소) -->
    <path d="M -18,-75 A 24,32 0 0,1 10,-90 A 26,34 0 0,0 -22,-65 Z" fill="#ffffff" opacity="0.35"/>

  </g>
</svg>
