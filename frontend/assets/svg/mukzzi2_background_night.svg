<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="roomBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1412" />
      <stop offset="100%" stop-color="#211A14" />
    </linearGradient>
    <linearGradient id="floorBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2118" />
      <stop offset="100%" stop-color="#1F1810" />
    </linearGradient>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06091A" />
      <stop offset="40%" stop-color="#0C1230" />
      <stop offset="100%" stop-color="#1A2845" />
    </linearGradient>
    <linearGradient id="cityGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2845" stop-opacity="0" />
      <stop offset="100%" stop-color="#2A1A08" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#FFE4A0" />
    </radialGradient>
    <radialGradient id="lampLight" cx="50%" cy="0%" r="80%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#FFD580" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFD580" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="windowClip">
      <rect x="270" y="120" width="460" height="560" rx="12" />
    </clipPath>
  </defs>

  <!-- 방 배경 (앱 배경색과 동일) -->
  <rect width="1000" height="1000" fill="url(#roomBg)" />

  <!-- 바닥 -->
  <rect x="0" y="760" width="1000" height="240" fill="url(#floorBg)" />
  <!-- 바닥 목재 결 -->
  <g stroke="#2E2418" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="800" x2="1000" y2="800" />
    <line x1="0" y1="840" x2="1000" y2="840" />
    <line x1="0" y1="880" x2="1000" y2="880" />
    <line x1="0" y1="920" x2="1000" y2="920" />
    <line x1="0" y1="960" x2="1000" y2="960" />
