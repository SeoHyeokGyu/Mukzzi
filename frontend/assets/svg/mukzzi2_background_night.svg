  <!-- 창문 중간 가로 프레임 -->
  <rect x="270" y="415" width="460" height="10" fill="#3A2D1E" />
  <!-- 창문 중간 세로 프레임 -->
  <rect x="495" y="120" width="10" height="560" fill="#3A2D1E" />

  <!-- 창문 유리 반사광 -->
