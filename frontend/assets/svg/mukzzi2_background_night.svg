      <rect x="608" y="525" width="5" height="4" rx="1" fill="#FFD580" />

      <rect x="676" y="445" width="5" height="4" rx="1" fill="#FFE4A0" />
      <rect x="686" y="458" width="5" height="4" rx="1" fill="#FFD580" />
      <rect x="676" y="471" width="5" height="4" rx="1" fill="#FFC85A" />
