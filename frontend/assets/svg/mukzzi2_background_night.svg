    <path d="M 310 660 Q 310 638 310 622" fill="none" stroke="#2D4A1E" stroke-width="4" stroke-linecap="round" />
    <path d="M 310 660 Q 325 640 332 625" fill="none" stroke="#2D4A1E" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="288" cy="622" rx="10" ry="8" fill="#3D6028" />
    <ellipse cx="310" cy="618" rx="12" ry="9" fill="#4A7832" />
    <ellipse cx="332" cy="622" rx="10" ry="8" fill="#3D6028" />
