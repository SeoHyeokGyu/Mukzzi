<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="wallBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF5EA" />
    </linearGradient>
    <linearGradient id="counterBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2C18D" />
      <stop offset="100%" stop-color="#D99B59" />
    </linearGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD" />
      <stop offset="100%" stop-color="#BBDEFB" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#A1887F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 1. 기본 벽면 배경 — 100px 인셋, rx=60으로 모서리 둥글게 -->
  <rect x="100" y="100" width="800" height="800" rx="60" fill="url(#wallBg)" />

  <!-- 2. 주방 타일 격자선 — 100~900 범위로 클리핑 -->
  <g stroke="#EFE5D8" stroke-width="2">
    <line x1="100" y1="200" x2="900" y2="200" />
    <line x1="100" y1="300" x2="900" y2="300" />
    <line x1="100" y1="400" x2="900" y2="400" />
    <line x1="100" y1="500" x2="900" y2="500" />
    <line x1="100" y1="600" x2="900" y2="600" />
    <line x1="100" y1="700" x2="900" y2="700" />
    <line x1="200" y1="100" x2="200" y2="750" />
    <line x1="300" y1="100" x2="300" y2="750" />
    <line x1="400" y1="100" x2="400" y2="750" />
    <line x1="500" y1="100" x2="500" y2="750" />
    <line x1="600" y1="100" x2="600" y2="750" />
    <line x1="700" y1="100" x2="700" y2="750" />
    <line x1="800" y1="100" x2="800" y2="750" />
  </g>

  <!-- 3. 중앙 아치형 창문 -->
  <g filter="url(#shadow)">
    <path d="M 380 320 L 380 180 A 120 120 0 0 1 620 180 L 620 320 Z" fill="url(#windowSky)" />
    <circle cx="440" cy="200" r="25" fill="#FFFFFF" opacity="0.85" />
    <circle cx="465" cy="210" r="20" fill="#FFFFFF" opacity="0.85" />
    <circle cx="420" cy="215" r="18" fill="#FFFFFF" opacity="0.85" />
    <path d="M 380 320 L 380 180 A 120 120 0 0 1 620 180 L 620 320 Z" fill="none" stroke="#FFFFFF" stroke-width="12" />
    <line x1="500" y1="120" x2="500" y2="320" stroke="#FFFFFF" stroke-width="6" />
    <line x1="380" y1="220" x2="620" y2="220" stroke="#FFFFFF" stroke-width="6" />
    <rect x="360" y="315" width="280" height="14" rx="6" fill="#FFFFFF" />
  </g>

  <!-- 4. 좌측 상단: 조리기구 걸이 -->
  <g filter="url(#shadow)">
    <rect x="150" y="160" width="160" height="8" rx="4" fill="#BCAAA4" />
    <path d="M 185 168 L 185 180 A 6 6 0 0 0 197 180" fill="none" stroke="#78909C" stroke-width="3" stroke-linecap="round"/>
    <path d="M 230 168 L 230 180 A 6 6 0 0 0 242 180" fill="none" stroke="#78909C" stroke-width="3" stroke-linecap="round"/>
    <path d="M 275 168 L 275 180 A 6 6 0 0 0 287 180" fill="none" stroke="#78909C" stroke-width="3" stroke-linecap="round"/>
    <path d="M 193 180 L 187 195 C 180 205 180 215 190 225 C 200 235 210 230 213 215 L 215 195 Z" fill="#FF8A80" />
    <circle cx="189" cy="202" r="4" fill="#FFFFFF" />
    <circle cx="236" cy="215" r="22" fill="#90A4AE" />
    <line x1="236" y1="180" x2="236" y2="193" stroke="#78909C" stroke-width="4" />
  </g>

  <!-- 5. 우측 상단: 벽면 선반 -->
  <g filter="url(#shadow)">
    <rect x="700" y="260" width="190" height="16" rx="5" fill="#CDA377" />
    <path d="M 725 225 L 755 225 L 750 260 L 730 260 Z" fill="#A1887F" />
    <circle cx="730" cy="210" r="14" fill="#81C784" />
    <circle cx="750" cy="205" r="16" fill="#66BB6A" />
    <circle cx="740" cy="195" r="12" fill="#4CAF50" />
    <path d="M 810 260 L 855 228 L 868 260 Z" fill="#FFD54F" />
    <path d="M 855 228 L 868 260 L 878 260 L 868 228 Z" fill="#FFC107" />
    <circle cx="835" cy="250" r="4" fill="#FFB300" opacity="0.4"/>
    <circle cx="854" cy="252" r="3" fill="#FFB300" opacity="0.4"/>
  </g>

  <!-- 6. 조리대 베이스 — 100~900 범위, 하단 rx -->
  <rect x="100" y="750" width="800" height="150" rx="0" fill="url(#counterBg)" />
  <rect x="100" y="742" width="800" height="12" fill="#C68B45" />

  <!-- 7. 좌측 하단: 치즈 -->
  <g filter="url(#shadow)">
    <path d="M 245 840 L 135 785 Q 215 738 295 755 Z" fill="#FFE082" />
    <path d="M 135 785 L 245 840 L 245 900 L 135 845 Z" fill="#FFCA28" />
    <path d="M 245 840 L 295 755 L 295 815 L 245 900 Z" fill="#F57F17" />
    <ellipse cx="175" cy="808" rx="12" ry="6" fill="#F57F17" opacity="0.3"/>
    <ellipse cx="258" cy="818" rx="15" ry="8" fill="#F57F17" opacity="0.3"/>
  </g>

  <!-- 8. 우측 하단: 쿠키병 -->
  <g filter="url(#shadow)">
    <rect x="760" y="775" width="120" height="130" rx="28" fill="#E0F7FA" opacity="0.7" stroke="#B2EBF2" stroke-width="4" />
    <rect x="778" y="758" width="84" height="18" rx="6" fill="#FFB74D" />
    <circle cx="820" cy="751" r="9" fill="#FFA726" />
    <circle cx="796" cy="868" r="22" fill="#BCAAA4" />
    <circle cx="796" cy="873" r="3" fill="#5D4037" />
    <circle cx="837" cy="850" r="22" fill="#BCAAA4" />
    <circle cx="832" cy="850" r="3" fill="#5D4037" />
    <circle cx="812" cy="818" r="22" fill="#BCAAA4" />
    <circle cx="817" cy="818" r="3" fill="#5D4037" />
  </g>

  <!-- 9. 데코 반짝이 -->
  <path d="M 320 450 Q 320 430 300 430 Q 320 430 320 410 Q 320 430 340 430 Q 320 430 320 450 Z" fill="#FFD54F" />
  <path d="M 700 520 Q 700 505 685 505 Q 700 505 700 490 Q 700 505 715 505 Q 700 505 700 520 Z" fill="#FFD54F" />
  <path d="M 240 580 Q 240 570 230 570 Q 240 570 240 560 Q 240 570 250 570 Q 240 570 240 580 Z" fill="#FFD54F" />
  <circle cx="310" cy="520" r="8" fill="#FFAB91" opacity="0.4" />
  <circle cx="720" cy="470" r="11" fill="#FFF59D" opacity="0.5" />
</svg>
